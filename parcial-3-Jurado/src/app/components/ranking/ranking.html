<section class="panel">
  <header class="head">
    <h3>Ranking</h3>

    <label class="topk">
      Top
      <select class="field" (change)="onK($event)">
        @for (n of options; track n) {
          <option [value]="n" [selected]="n === k()">{{ n }}</option>
        }
      </select>
    </label>
  </header>

  <ol>
    @for (s of songs(); track s.id; let i = $index) {
      <li [class.first]="i === 0">
        <span class="pos">{{ i + 1 }}</span>

        <div class="info">
          <span class="title">{{ s.title }}</span>
          <span class="artist">{{ s.artist }}</span>
          <span class="bar"><span class="fill" [style.width.%]="percent(s.plays)"></span></span>
        </div>

        <span class="plays">{{ s.plays | number }}</span>
        <button class="ghost" type="button" title="Reproducir" (click)="listen(s.id)">▶</button>
        <button class="ghost" type="button" title="Ver relacionadas" (click)="choose(s.id)">⇢</button>
      </li>
    }
  </ol>
</section>
