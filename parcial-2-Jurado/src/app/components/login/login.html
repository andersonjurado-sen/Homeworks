<div class="login-card">
  <h2>Gestor de carpetas y archivos</h2>
  <p class="hint">Inicia sesión o regístrate para continuar</p>

  <form (ngSubmit)="onLogin()">
    <input type="email" placeholder="Correo" [(ngModel)]="email" name="email" />
    <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="loading()">Iniciar sesión</button>
      <button type="button" class="secondary" (click)="onRegister()" [disabled]="loading()">
        Registrarme
      </button>
    </div>
  </form>
</div>
