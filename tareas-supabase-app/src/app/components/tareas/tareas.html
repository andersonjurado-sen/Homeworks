<div class="tareas">
  <header class="topbar">
    <span>Sesión: {{ auth.session()?.user?.email }}</span>
    <span class="acciones">
      <a routerLink="/perfil">Mi perfil</a>
      <button class="secondary" (click)="salir()">Salir</button>
    </span>
  </header>

  <h1>Mis tareas</h1>

  <form class="nueva" (ngSubmit)="agregar()">
    <input name="nueva" [(ngModel)]="nueva" placeholder="Nueva tarea" required />
    <button type="submit">Agregar</button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <ul>
    @for (t of tareas(); track t.id) {
      <li>
        <input
          type="checkbox"
          [checked]="t.completada"
          (change)="completar(t)"
        />
        <span [class.hecha]="t.completada">{{ t.titulo }}</span>
        <button class="borrar" (click)="borrar(t.id)">Borrar</button>
      </li>
    } @empty {
      <li class="vacio">No hay tareas</li>
    }
  </ul>
</div>
